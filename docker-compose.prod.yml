services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file:
      - .env.production
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    volumes:
      - yaren_uploads:/app/apps/uploads
    restart: unless-stopped
    networks:
      - yaren
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    # Do not bind host :80/:443 — Caddy already owns those.
    # Caddy should reverse_proxy to http://web:80 on the shared network.
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - yaren

networks:
  yaren:
    name: yaren
    # Set true if Caddy already created this network:
    # external: true

volumes:
  yaren_uploads:
