# Local development database only.
# Production app stack (no Postgres image): docker-compose.prod.yml
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yaren
      POSTGRES_PASSWORD: yaren
      POSTGRES_DB: yaren
    ports:
      - "5433:5432"
    volumes:
      - yaren_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaren -d yaren"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  yaren_pg:
