services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yaren
      POSTGRES_PASSWORD: yaren
      POSTGRES_DB: yaren
    ports:
      - "5433:5432"
    volumes:
      - yaren_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaren -d yaren"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://yaren:yaren@postgres:5432/yaren
      JWT_SECRET: dev-only-change-this-secret
      PORT: 3000
      SEED_ADMIN_PASSWORD: ChangeMe!2026
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  yaren_pg:
